@if (loading) {
  <div class="py-10 flex justify-center">
    <p class="text-[var(--p-text-muted-color)]">Loading&hellip;</p>
  </div>
} @else if (viewModel) {
  <app-session-placeholder [currentLabel]="viewModel.title" />
  <div class="flex flex-col lg:flex-row lg:flex-wrap gap-6 lg:gap-0">
    @switch (viewModel.kind) {
      @case (EntityType.PHENOTYPE) {
        <div class="w-full lg:w-[284px] lg:shrink-0 bg-white border border-t-0 border-[#e2e8f0] px-6 py-4">
          <app-hierarchy-tree
            [term]="viewModel.term"
            [treeData]="viewModel.treeData"
            [selectedLanguage]="selectedLanguage"
          />
        </div>
        <div class="flex-1 min-w-0 p-6">
          <app-term-page-content [viewModel]="viewModel" [selectedLanguage]="selectedLanguage" />
        </div>
      }
    }

    <!-- 282px is the narrowest the export button's label fits without wrapping. -->
    <aside class="w-full xl:w-[282px] xl:shrink-0 px-6 py-8">
      <div class="xl:sticky xl:top-4 flex flex-col gap-4">
        <app-on-this-page-panel-menu [items]="sections" />
        <app-export-associations-button [id]="viewModel.id" [counts]="viewModel.downloadCounts" />
        <app-report-entry-issue-button [id]="viewModel.id" />
      </div>
    </aside>
  </div>
}
