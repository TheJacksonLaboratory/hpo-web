<nav
  class="rounded-md border border-[var(--p-content-border-color)] bg-[var(--p-content-background)] p-1"
  aria-label="On this page"
>
  <p class="p-3 text-base font-semibold text-[var(--p-text-color)] my-0">
    On this page
  </p>
  <ul class="list-none m-0 p-0">
    @for (item of items; track item.id) {
      <li class="pl-4">
        <button
          type="button"
          class="w-full text-left p-2 rounded-md text-base transition-colors"
          [ngClass]="{
            'text-[var(--p-form-field-disabled-color)] cursor-not-allowed': item.disabled,
            'font-bold text-[#222] bg-[var(--p-teal-300)]': !item.disabled && activeAnchor === item.anchor,
            'text-[var(--p-text-color)]': !item.disabled && activeAnchor !== item.anchor
          }"
          [disabled]="item.disabled"
          (click)="scrollTo(item)"
        >
          {{ item.label }}@if (item.count !== undefined) { ({{ item.count }})}
        </button>
      </li>
    }
  </ul>
</nav>
