<!-- Figma 315:4478: outlined warn, bug icon leading. -->
<a
  pButton
  type="button"
  severity="warn"
  [outlined]="true"
  class="w-full"
  [href]="issueUrl"
  target="_blank"
>
  <i class="pi pi-exclamation-triangle"></i>
  <span class="font-bold whitespace-nowrap">Report Entry Issue</span>
</a>
